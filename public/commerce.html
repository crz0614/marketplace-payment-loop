<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vesper Commerce Ops</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#18221b;background:#f1f4ee}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:28px 22px 64px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:21px}.actions{display:flex;gap:8px;align-items:center}.pill,button,input,select{font:inherit;border:1px solid #c9d2cb;border-radius:10px;padding:10px 12px}button{background:#173f2a;color:#fff;border-color:#173f2a;cursor:pointer;font-weight:750}.secondary{background:#fff;color:#173f2a}h1{font-size:clamp(40px,7vw,72px);line-height:.98;letter-spacing:-.055em;max-width:880px;margin:70px 0 18px}.lead{font-size:18px;line-height:1.55;color:#536057;max-width:790px}.channels,.two{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:34px 0}.two{grid-template-columns:1fr 1fr}.card,.panel{background:#fff;border:1px solid #d7ded8;border-radius:18px;padding:20px}.channel b{display:block;margin-bottom:8px}.tag{font-size:12px;color:#315b40;background:#e8f3e9;padding:4px 8px;border-radius:999px}.panel{margin:14px 0}.stack{display:grid;gap:10px}.hidden{display:none!important}.mapping{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mapping label{display:grid;gap:4px;font-size:13px}.notice{min-height:24px;color:#315b40}.orders{width:100%;border-collapse:collapse}.orders th,.orders td{text-align:left;border-bottom:1px solid #e2e6e2;padding:10px 7px;font-size:14px}.muted{color:#6a756d;font-size:13px}@media(max-width:760px){.channels,.two,.mapping{grid-template-columns:1fr}h1{margin-top:48px}.orders{display:block;overflow:auto}header{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}}
</style></head><body><main class="wrap"><header><div class="brand">Vesper Commerce Ops</div><div class="actions"><span id="identity" class="pill" data-i18n="guest">访客</span><button id="language" class="secondary" type="button">English</button><button id="logout" class="secondary hidden" type="button" data-i18n="logout">退出</button></div></header>
<h1 data-i18n="title">把七个平台的订单放进同一本账。</h1><p class="lead" data-i18n="lead">Amazon、淘宝/天猫、拼多多、抖音电商、小红书、Shopify 和 WooCommerce。先可靠接收官方导出文件，再在取得商家授权后启用官方 API。</p>
<section id="channels" class="channels"></section>
<section id="auth" class="panel"><h2 data-i18n="account">账户</h2><div class="two"><form id="register" class="stack"><b data-i18n="register">创建账户</b><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="10" data-i18n-placeholder="password" placeholder="密码（至少 10 位）" required><button data-i18n="register">创建账户</button></form><form id="login" class="stack"><b data-i18n="login">登录</b><input name="email" type="email" placeholder="Email" required><input name="password" type="password" data-i18n-placeholder="passwordShort" placeholder="密码" required><button data-i18n="login">登录</button></form></div></section>
<div id="workspace" class="hidden"><section class="two"><article class="panel"><h2 data-i18n="addShop">添加店铺</h2><form id="shopForm" class="stack"><select id="channel" name="channel" required></select><input name="name" maxlength="120" data-i18n-placeholder="shopName" placeholder="店铺名称" required><button data-i18n="saveShop">保存店铺</button></form></article><article class="panel"><div class="row"><h2 data-i18n="shops">店铺</h2><button id="refreshShops" class="secondary" data-i18n="refresh">刷新</button></div><div id="shopList"></div></article></section>
<section class="panel"><h2 data-i18n="importTitle">导入官方 CSV 导出文件</h2><p class="muted" data-i18n="importHelp">文件只在当前页面解析；每次最多 100 行、32 KB，映射后通过鉴权 API 原子写入 PostgreSQL。</p><form id="importForm" class="stack"><select id="importShop" name="importShop" required></select><input id="csvFile" type="file" accept=".csv,text/csv" required><div id="mapping" class="mapping"></div><button data-i18n="importButton">校验并导入</button></form></section>
<section class="panel"><div class="row"><h2 data-i18n="importHistory">导入记录</h2><button id="refreshImports" class="secondary" data-i18n="refresh">刷新</button></div><div id="importList"></div></section>
<section class="panel"><div class="row"><h2 data-i18n="orders">统一订单账本</h2><div class="actions"><select id="orderShop"></select><button id="refreshOrders" class="secondary" data-i18n="refresh">刷新</button></div></div><div id="orderList"></div></section></div><p id="notice" class="notice" role="status"></p></main><script>
const API='https://hqxyjaepuaruiwdfvvqj.supabase.co/functions/v1/marketplace-payment-loop',channels={amazon:'Amazon',taobao:'淘宝 / Tmall',pinduoduo:'拼多多 / Pinduoduo',douyin:'抖音电商 / Douyin Shop',xiaohongshu:'小红书 / RED',shopify:'Shopify',woocommerce:'WooCommerce'},fields=['external_order_id','sku','quantity','amount','currency','status','occurred_at'];
const copy={zh:{guest:'访客',logout:'退出',title:'把七个平台的订单放进同一本账。',lead:'Amazon、淘宝/天猫、拼多多、抖音电商、小红书、Shopify 和 WooCommerce。先可靠接收官方导出文件，再在取得商家授权后启用官方 API。',account:'账户',register:'创建账户',login:'登录',password:'密码（至少 10 位）',passwordShort:'密码',addShop:'添加店铺',shopName:'店铺名称',saveShop:'保存店铺',shops:'店铺',shop:'店铺',allShops:'全部店铺',refresh:'刷新',importTitle:'导入官方 CSV 导出文件',importHelp:'文件只在当前页面解析；每次最多 100 行、32 KB，映射后通过鉴权 API 原子写入 PostgreSQL。',importButton:'校验并导入',importHistory:'导入记录',noImports:'还没有导入记录。',source:'来源文件',rows:'行数',orders:'统一订单账本',manual:'官方导出可用 · API 待授权',noShops:'还没有店铺。',noOrders:'还没有订单。',chooseShop:'选择店铺',fileReady:'已读取 {n} 行，请确认字段映射。',imported:'已导入 {n} 行。',shopSaved:'店铺已保存。',signedIn:'已登录。',signedOut:'已退出。',map:'映射：',orderId:'订单号',qty:'数量',amount:'金额',status:'状态',time:'时间'},en:{guest:'Guest',logout:'Log out',title:'Put seven commerce channels into one ledger.',lead:'Amazon, Taobao/Tmall, Pinduoduo, Douyin Shop, Xiaohongshu, Shopify and WooCommerce. Reliable official-export ingestion comes first; official APIs activate only after merchant authorization.',account:'Account',register:'Create account',login:'Sign in',password:'Password (10+ characters)',passwordShort:'Password',addShop:'Add shop',shopName:'Shop name',saveShop:'Save shop',shops:'Shops',shop:'Shop',allShops:'All shops',refresh:'Refresh',importTitle:'Import an official CSV export',importHelp:'The file is parsed in this page; each import is limited to 100 rows and 32 KB, then mapped and atomically written to PostgreSQL through the authenticated API.',importButton:'Validate and import',importHistory:'Import history',noImports:'No imports yet.',source:'Source file',rows:'Rows',orders:'Canonical order ledger',manual:'Official export ready · API awaiting authorization',noShops:'No shops yet.',noOrders:'No orders yet.',chooseShop:'Choose a shop',fileReady:'Read {n} rows. Confirm the field mapping.',imported:'Imported {n} rows.',shopSaved:'Shop saved.',signedIn:'Signed in.',signedOut:'Signed out.',map:'Map:',orderId:'Order',qty:'Qty',amount:'Amount',status:'Status',time:'Time'}};
const errors={zh:{authentication_required:'请先登录。',invalid_shop:'店铺信息无效。',shop_exists:'该店铺已存在。',invalid_import:'导入内容无效。',import_failed:'导入失败，未写入任何数据。',invalid_amount:'金额格式无效。',invalid_currency:'币种无效。',invalid_quantity:'数量无效。',invalid_occurred_at:'订单时间无效。',invalid_json:'请求格式无效。',body_too_large:'导入请求过大，请拆分文件。',service_unavailable:'服务暂时不可用，请稍后再试。',csv_required:'请选择 CSV 文件。',invalid_csv:'CSV 引号格式无效。',invalid_csv_shape:'CSV 列数不一致或没有数据。',file_too_large:'CSV 超过 32 KB，请拆分文件。',too_many_rows:'每次最多导入 100 行，请拆分文件。',duplicate_mapping:'每个标准字段必须映射到不同的 CSV 列。',request_failed:'请求失败，请稍后再试。'},en:{authentication_required:'Please sign in first.',invalid_shop:'The shop details are invalid.',shop_exists:'This shop already exists.',invalid_import:'The import payload is invalid.',import_failed:'Import failed. No data was written.',invalid_amount:'The amount format is invalid.',invalid_currency:'The currency is invalid.',invalid_quantity:'The quantity is invalid.',invalid_occurred_at:'The order time is invalid.',invalid_json:'The request format is invalid.',body_too_large:'The import request is too large. Split the file.',service_unavailable:'The service is temporarily unavailable. Try again later.',csv_required:'Choose a CSV file.',invalid_csv:'The CSV quoting is invalid.',invalid_csv_shape:'CSV columns are inconsistent or contain no data.',file_too_large:'The CSV exceeds 32 KB. Split the file.',too_many_rows:'Each import accepts at most 100 rows. Split the file.',duplicate_mapping:'Map each canonical field to a different CSV column.',request_failed:'The request failed. Try again later.'}};
let lang=localStorage.getItem('vco_lang')||'zh',token=localStorage.getItem('mpl_token')||'',csvRows=[],headers=[];const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),t=(k,n)=>copy[lang][k].replace('{n}',n??'');
function translate(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=t(x.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(x=>x.placeholder=t(x.dataset.i18nPlaceholder));$('#language').textContent=lang==='zh'?'English':'中文';renderChannels();renderMapping()}
function renderChannels(){$('#channels').innerHTML=Object.entries(channels).map(([k,v])=>`<article class="card channel" data-channel="${k}"><b>${v}</b><span class="tag">${t('manual')}</span></article>`).join('');$('#channel').innerHTML=Object.entries(channels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
async function api(path,o={}){const r=await fetch(API+path,{...o,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{}),...(o.headers||{})}}),b=await r.json();if(!r.ok)throw Error(b.error||'request_failed');return b}const values=f=>Object.fromEntries(new FormData(f)),say=(m,bad=false)=>{$('#notice').textContent=m;$('#notice').style.color=bad?'#9a332d':'#315b40'},errorText=code=>errors[lang][code]||errors[lang].request_failed;
async function session(){try{const {user}=await api('/api/me');$('#identity').textContent=user.email;$('#auth').classList.add('hidden');$('#workspace').classList.remove('hidden');$('#logout').classList.remove('hidden');await Promise.all([shops(),imports(),orders()])}catch{$('#identity').textContent=t('guest');$('#auth').classList.remove('hidden');$('#workspace').classList.add('hidden');$('#logout').classList.add('hidden')}}
async function shops(){const a=(await api('/api/commerce/shops')).shops,selected=$('#orderShop').value;$('#shopList').innerHTML=a.length?a.map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="muted">${esc(channels[x.channel])} · ${t('manual')}</div></div>`).join(''):`<p class="muted">${t('noShops')}</p>`;const options=a.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(channels[x.channel])}</option>`).join('');$('#importShop').innerHTML=`<option value="">${t('chooseShop')}</option>`+options;$('#orderShop').innerHTML=`<option value="">${t('allShops')}</option>`+options;$('#orderShop').value=selected}
async function imports(){const a=(await api('/api/commerce/imports')).imports;$('#importList').innerHTML=a.length?`<table class="orders"><thead><tr><th>${t('shop')}</th><th>${t('source')}</th><th>${t('rows')}</th><th>${t('time')}</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.shop?esc(x.shop.name)+' · '+esc(channels[x.shop.channel]||x.shop.channel):'—'}</td><td>${esc(x.source_name)}</td><td>${x.row_count}</td><td>${new Date(x.created_at).toLocaleString(lang==='zh'?'zh-CN':'en')}</td></tr>`).join('')}</tbody></table>`:`<p class="muted">${t('noImports')}</p>`}
async function orders(){const shop=$('#orderShop').value,a=(await api('/api/commerce/orders'+(shop?'?shop_id='+encodeURIComponent(shop):''))).orders;$('#orderList').innerHTML=a.length?`<table class="orders"><thead><tr><th>${t('shop')}</th><th>${t('orderId')}</th><th>SKU</th><th>${t('qty')}</th><th>${t('amount')}</th><th>${t('status')}</th><th>${t('time')}</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.shop?esc(x.shop.name)+' · '+esc(channels[x.shop.channel]||x.shop.channel):'—'}</td><td>${esc(x.external_order_id)}</td><td>${esc(x.sku)}</td><td>${x.quantity}</td><td>${(x.amount_minor/100).toFixed(2)} ${esc(x.currency)}</td><td>${esc(x.status)}</td><td>${new Date(x.occurred_at).toLocaleString(lang==='zh'?'zh-CN':'en')}</td></tr>`).join('')}</tbody></table>`:`<p class="muted">${t('noOrders')}</p>`}
function parseCsv(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&quote&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quote=!quote;else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(Boolean))rows.push(row);if(quote)throw Error('invalid_csv');return rows}
function renderMapping(){if(!headers.length){$('#mapping').innerHTML='';return}$('#mapping').innerHTML=fields.map(f=>`<label>${t('map')} ${f}<select name="${f}" required>${headers.map((h,i)=>`<option value="${i}" ${h.trim().toLowerCase()===f?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}
$('#language').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('vco_lang',lang);translate();session()};for(const id of ['register','login'])$('#'+id).onsubmit=async e=>{e.preventDefault();try{const x=await api('/api/'+id,{method:'POST',body:JSON.stringify(values(e.target))});token=x.token;localStorage.setItem('mpl_token',token);e.target.reset();say(t('signedIn'));await session()}catch(x){say(errorText(x.message),true)}};
$('#logout').onclick=async()=>{try{await api('/api/logout',{method:'POST',body:'{}'})}finally{token='';localStorage.removeItem('mpl_token');say(t('signedOut'));session()}};$('#shopForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/commerce/shops',{method:'POST',body:JSON.stringify(values(e.target))});e.target.reset();say(t('shopSaved'));await shops()}catch(x){say(errorText(x.message),true)}};$('#refreshShops').onclick=()=>shops().catch(x=>say(errorText(x.message),true));$('#refreshImports').onclick=()=>imports().catch(x=>say(errorText(x.message),true));$('#refreshOrders').onclick=$('#orderShop').onchange=()=>orders().catch(x=>say(errorText(x.message),true));
$('#csvFile').onchange=async e=>{try{const file=e.target.files[0];if(!file)throw Error('csv_required');if(file.size>32768)throw Error('file_too_large');const rows=parseCsv(await file.text());headers=rows.shift().map(x=>x.trim());csvRows=rows.filter(x=>x.some(Boolean));if(!headers.length||!csvRows.length||csvRows.some(r=>r.length!==headers.length))throw Error('invalid_csv_shape');if(csvRows.length>100)throw Error('too_many_rows');renderMapping();say(t('fileReady',csvRows.length))}catch(x){headers=[];csvRows=[];renderMapping();say(errorText(x.message),true)}};
$('#importForm').onsubmit=async e=>{e.preventDefault();try{if(!csvRows.length)throw Error('csv_required');const v=values(e.target),mapped=fields.map(f=>v[f]);if(new Set(mapped).size!==mapped.length)throw Error('duplicate_mapping');const rows=csvRows.map(r=>Object.fromEntries(fields.map(f=>[f,r[Number(v[f])]])));const x=await api('/api/commerce/imports',{method:'POST',body:JSON.stringify({shop_id:v.importShop,source_name:$('#csvFile').files[0].name,rows})});say(t('imported',x.row_count));e.target.reset();headers=[];csvRows=[];renderMapping();await Promise.all([imports(),orders()])}catch(x){say(errorText(x.message),true)}};translate();session();
</script></body></html>
